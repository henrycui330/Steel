name = "steel-auth"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# After: wrangler d1 create steel-auth
# paste the database_id below, then: wrangler d1 execute steel-auth --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "steel-auth"
database_id = "a42cf737-8891-4a56-94c2-6ac23aa85349"

[[durable_objects.bindings]]
name = "STEEL_ROOM"
class_name = "SteelRoom"

[[migrations]]
tag = "v1-mp-rooms"
new_sqlite_classes = ["SteelRoom"]

[vars]
# Comma-separated browser origins allowed to call this API
# Local Vite ports are also allowed via isLocalDevOrigin() in src/index.ts
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173,https://henrycui330.github.io"
